name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest

      - name: Run adversarial + durability eval harness
        run: uv run governor-agent eval

      - name: Smoke-test the CLI (interrupt + auto-approve flow)
        run: uv run governor-agent run "total balance by region" --approve
